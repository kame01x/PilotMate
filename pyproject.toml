[project]
name = "pilotmate"
version = "0.1.0"
description = "Training assistant app for student pilots and flight instructors"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=2.28.0",
    "tavily-python>=0.8.4",
    "httpx>=0.28.1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
