[project]
name = "pilotmate"
version = "0.1.0"
description = "Training assistant app for student pilots and flight instructors"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=2.28.0",
    "tavily-python>=0.8.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
