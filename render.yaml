services:
  - type: web
    name: pilotmate-api-staging
    runtime: python
    buildCommand: "uv sync"
    startCommand: "uv run uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: pilotmate-staging-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRY_MINUTES
        value: "1440"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIOWIKI_API_KEY
        sync: false
      - key: RATE_LIMIT_AI_REQUESTS
        value: "50"
      - key: RATE_LIMIT_AI_WINDOW
        value: "3600"
      - key: RATE_LIMIT_AUTH_REQUESTS
        value: "10"
      - key: RATE_LIMIT_AUTH_WINDOW
        value: "60"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: pilotmate-frontend-staging
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "/api-proxy"
      - key: BACKEND_URL
        fromService:
          name: pilotmate-api-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STAGING_AUTH_USER
        sync: false
      - key: STAGING_AUTH_PASS
        sync: false
    autoDeploy: true

databases:
  - name: pilotmate-staging-db
    databaseName: pilotmate_staging
    ipAllowList: []
